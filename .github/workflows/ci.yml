name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Electron smoke tests
        run: |
          npm run test:app
          npm run test:update

      - name: Build NSIS release
        run: npm run package

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Verify release credentials
        run: npm run verify:security -- --require-artifacts

      - name: NSIS installer smoke test
        run: npm run test:installer
