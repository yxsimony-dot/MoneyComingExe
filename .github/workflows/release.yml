name: Publish Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moneycoming-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      AUTOMATIC_RELEASE_BASE_RUN_NUMBER: 11
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve automatic release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $latestTag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            $latestTag = ""
            $global:LASTEXITCODE = 0
          }
          $env:LATEST_RELEASE_TAG = $latestTag
          npm run resolve:release-version -- `
            --run-number $env:GITHUB_RUN_NUMBER `
            --base-run-number $env:AUTOMATIC_RELEASE_BASE_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and validate release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run verify:tag -- --tag "${{ steps.version.outputs.tag }}"
          gh release view "${{ steps.version.outputs.tag }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release ${{ steps.version.outputs.tag }} already exists and will not be overwritten."
          }
          $global:LASTEXITCODE = 0

      - name: Quality gate
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run test:app
          npm run test:update

      - name: Build NSIS release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          Remove-Item -LiteralPath release -Recurse -Force -ErrorAction SilentlyContinue
          npm run package

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Verify release credentials
        run: npm run verify:security -- --require-artifacts

      - name: NSIS installer smoke test
        run: npm run test:installer

      - name: Verify optional code signature
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            "Unsigned build: Windows may show an unknown publisher warning." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          $installers = @(Get-ChildItem -LiteralPath release -File -Filter 'MoneyComing-Setup-*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $targets = @($installer.FullName, (Resolve-Path 'release/win-unpacked/MoneyComing.exe').Path)
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${target}: $($signature.Status)"
            }
          }

      - name: Create release tag
        id: tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          $stagedFiles = @(git diff --cached --name-only)
          if ($stagedFiles.Count -gt 0) {
            git commit -m "chore: prepare ${{ steps.version.outputs.tag }} release"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git tag -a "${{ steps.version.outputs.tag }}" -m "MoneyComing ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create complete draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -like 'MoneyComing-Setup-*.exe' -or $_.Name -like '*.exe.blockmap' } |
            Sort-Object Name
          if ($assets.Count -lt 3) {
            throw "Expected installer, blockmap, and latest.yml before publishing."
          }
          if ($assets.Name -match '\.zip$') {
            throw "ZIP assets are forbidden."
          }
          gh release create "${{ steps.version.outputs.tag }}" @($assets.FullName) --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title "${{ steps.version.outputs.tag }}" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "### Release assets" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $assets.Name | ForEach-Object { "- ``$_``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --repo $env:GITHUB_REPOSITORY --draft=false --latest

      - name: Verify anonymous public downloads
        run: npm run verify:public-release -- --tag "${{ steps.version.outputs.tag }}"

      - name: Remove incomplete release and tag after failure
        if: failure() && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "${{ steps.version.outputs.tag }}" --repo $env:GITHUB_REPOSITORY --yes
          }
          $global:LASTEXITCODE = 0
          git push origin ":refs/tags/${{ steps.version.outputs.tag }}"
